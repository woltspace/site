<script>
// The lodge on the first slide's land: a small cabin on the grass, three wolts in hats walking around it.
const W = 320, H = 200;
const ANCHOR = { beaver:{hx:8.5,ht:1}, otter:{hx:8.5,ht:1}, raccoon:{hx:9.5,ht:2} };
const CREW = [['raccoon','red-beanie'], ['beaver','straw-hat'], ['otter','blue-cap']];
const cv = document.getElementById('c'), c = cv.getContext('2d');
cv.width = W; cv.height = H; c.imageSmoothingEnabled = false;
const IMG = {};
const load = n => new Promise(r => { const i = new Image(); i.onload = () => { IMG[n] = i; r(); }; i.src = `img/${n}.png`; });
const rnd = (a, b) => a + Math.random() * (b - a);
const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
let GROUND = 183;                                   // feet line, measured from the scene below
const CABIN = { x: 128, w: 92 };
const wolts = CREW.map(([kind, hat], i) => ({ kind, hat, x: 60 + i * 90, vx: (i % 2 ? -1 : 1) * rnd(9, 14), hop: rnd(0, 6), bump: 0 }));

function cabin(t) {                                 // a log cabin wolts can live in, drawn pixel by pixel
  const { x, w } = CABIN, y = GROUND, h = 44, base = 5;
  // stone foundation
  for (let i = 0; i < w + 4; i += 6) { const o = (i / 6) % 2 ? 3 : 0; px(x - 2 + i, y - base, 5, base, '#8a8a84'); px(x - 2 + i, y - base, 5, 1, '#a9a9a2'); px(x - 2 + i + 5, y - base, 1, base, '#5c5c57'); }
  // walls: logs with a lit top, a dark seam and round log ends on both corners
  for (let r = 0; r < h - base; r += 5) {
    const ly = y - h + r;
    px(x, ly, w, 4, '#7a5530'); px(x, ly, w, 1, '#946a3c'); px(x, ly + 3, w, 1, '#664624'); px(x, ly + 4, w, 1, '#3f2a14');
    for (let k = 6 + (r % 10); k < w - 4; k += 17) px(x + k, ly + 1, 3, 1, '#6c4a28');          // grain
    for (const ex of [x - 3, x + w - 1]) { px(ex, ly, 4, 4, '#b48552'); px(ex + 1, ly + 1, 2, 2, '#d7ac72'); px(ex, ly + 3, 4, 1, '#7a5530'); }
  }
  // roof: staggered shingles, eave shadow, ridge
  const top = y - h, rows = Math.ceil(w / 2) - 14;
  for (let i = 0; i < rows; i++) {
    const rx = x - 7 + i, rw = w + 14 - i * 2, ry = top - i;
    px(rx, ry, rw, 1, (Math.floor(i / 3) % 2) ? '#5e3b26' : '#6a4430');
    if (i % 3 === 2) for (let k = (i % 6 === 2 ? 2 : 6); k < rw - 2; k += 8) px(rx + k, ry, 1, 3, '#432717');
  }
  px(x - 7, top, w + 14, 1, '#3a2213'); px(x - 4, top + 1, w + 8, 1, '#00000040');
  px(x - 7 + rows - 1, top - rows, w + 14 - (rows - 1) * 2, 2, '#7f5a3e');
  // chimney: stacked stones + smoke
  const cx = x + w - 26, cy = top - 26;
  for (let r = 0; r < 18; r += 3) for (let k = (r / 3) % 2 ? -2 : 0; k < 10; k += 4) px(cx + Math.max(0, k), cy + r, Math.min(3, 10 - Math.max(0, k)), 2, r % 6 ? '#7d7d77' : '#93938c');
  px(cx - 1, cy - 2, 12, 2, '#55554f');
  for (let i = 0; i < 4; i++) { const s = (t * 4 + i * 6) % 24; px(cx + 3 + Math.round(Math.sin(s / 4) * 2), cy - 5 - s, s > 14 ? 3 : 4, 3, s > 14 ? '#ffffff44' : '#ffffffaa'); }
  // door: planks, frame, handle; little porch step + lantern
  const dx = x + w / 2 - 9, dy = y - base - 28;
  px(dx - 2, dy - 2, 22, 30 + 2, '#3a2410');
  for (let k = 0; k < 18; k += 4) { px(dx + k, dy, 3, 28, '#5a3a1c'); px(dx + k + 3, dy, 1, 28, '#3f2913'); }
  px(dx, dy + 8, 18, 1, '#3f2913'); px(dx, dy + 20, 18, 1, '#3f2913'); px(dx + 14, dy + 14, 2, 2, '#d8b45a');
  px(dx - 4, y - 2, 26, 2, '#6b6b66'); px(dx - 4, y - 2, 26, 1, '#8a8a84');
  px(dx + 22, dy + 2, 3, 2, '#2a2a2a'); px(dx + 22, dy + 4, 3, 4, (Math.floor(t * 2) % 7) ? '#ffd77a' : '#ffe9a8'); px(dx + 22, dy + 8, 3, 1, '#2a2a2a');
  // windows: frame, warm glass with a glint, cross bars, shutters, flower box
  [[x + 10], [x + w - 30]].forEach(([wx]) => {
    const wy = y - base - 28;
    px(wx - 4, wy - 1, 3, 16, '#2f5a3a'); px(wx + 21, wy - 1, 3, 16, '#2f5a3a');
    for (let k = 0; k < 16; k += 3) { px(wx - 4, wy - 1 + k, 3, 1, '#244a2f'); px(wx + 21, wy - 1 + k, 3, 1, '#244a2f'); }
    px(wx - 1, wy - 1, 22, 16, '#3a2410'); px(wx, wy, 20, 14, '#e9c977'); px(wx + 1, wy + 1, 3, 1, '#fff2c4'); px(wx + 1, wy + 2, 1, 2, '#fff2c4');
    px(wx + 9, wy, 2, 14, '#3a2410'); px(wx, wy + 6, 20, 2, '#3a2410');
    px(wx - 1, wy + 15, 22, 3, '#6b4520'); px(wx - 1, wy + 15, 22, 1, '#8a5a2b');
    for (let k = 1; k < 20; k += 4) { px(wx + k, wy + 13, 2, 2, '#3f7a34'); px(wx + k + 1, wy + 12, 1, 1, ['#e06a6a', '#f0c84a', '#e8e8f0', '#c77ad8', '#f0c84a'][k % 5]); }
  });
}
function pine(x, y, h) {                             // a layered pixel pine, trunk to tip
  px(x - 2, y - 8, 4, 8, '#5a3a1c'); px(x - 2, y - 8, 1, 8, '#7a5530');
  const layers = 4, lh = (h - 6) / layers;
  for (let L = 0; L < layers; L++) {
    const by = Math.round(y - 6 - L * lh * 0.82), half0 = Math.round(16 - L * 3.2);
    for (let r = 0; r < lh; r++) {
      const half = Math.max(1, Math.round(half0 * (1 - r / lh))), ry = Math.round(by - r);
      px(x - half, ry, half * 2, 1, '#2e5a2a'); px(x - half, ry, Math.max(1, Math.round(half * 0.7)), 1, '#3f7a34');
      if (r === 0) px(x - half, ry, half * 2, 1, '#1f3f1d');
    }
  }
}
function drawWolt(w) {
  const im = IMG['c-' + w.kind], a = ANCHOR[w.kind], left = w.vx < 0;
  const lift = Math.abs(Math.sin(w.hop)) * 1.5 + (w.bump > 0 ? Math.sin(w.bump * Math.PI) * 6 : 0);
  const ox = Math.round(w.x - im.width / 2), oy = Math.round(GROUND - im.height - lift);
  c.save(); if (left) { c.translate(ox * 2 + im.width, 0); c.scale(-1, 1); } c.drawImage(im, ox, oy); c.restore();
  const h = IMG['h-' + w.hat], hx = left ? im.width - a.hx : a.hx;
  c.drawImage(h, Math.round(ox + hx - h.width / 2), oy + a.ht - h.height + 3);
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const w of wolts) {
    w.x += w.vx * dt; w.hop += dt * 8; if (w.bump > 0) w.bump -= dt * 2.5;
    if (w.x < 16 || w.x > W - 16) { w.vx = -w.vx; w.x = Math.max(16, Math.min(W - 16, w.x)); }
    if (Math.random() < dt * 0.15) w.vx = -w.vx;
  }
  for (let i = 0; i < wolts.length; i++) for (let j = i + 1; j < wolts.length; j++) {
    const a = wolts[i], b = wolts[j], dx = b.x - a.x;
    if (Math.abs(dx) < 16) { if (a.bump <= 0) a.bump = 1; if (b.bump <= 0) b.bump = 1; const s = Math.sign(dx) || 1; a.vx = -Math.abs(a.vx) * s; b.vx = Math.abs(b.vx) * s; a.x -= s; b.x += s; }
  }
  c.clearRect(0, 0, W, H); cabin(now / 1000);
  // a little nature around the lodge: one pine, one mushroom, a fern and a flower
  pine(CABIN.x + CABIN.w + 16, GROUND, 58);
  [['mushroom', CABIN.x - 12], ['fern', CABIN.x + CABIN.w + 36], ['flower', CABIN.x - 40]]
    .forEach(([n, mx]) => { const m = IMG['n-' + n]; c.drawImage(m, Math.round(mx - m.width / 2), GROUND - m.height + 1); });
  wolts.forEach(drawWolt);
  requestAnimationFrame(tick);
}
const frame = document.getElementById('scene');
frame.addEventListener('load', () => {
  const doc = frame.contentDocument, st = doc.createElement('style');
  setTimeout(() => {
    const feet = doc.getElementById('bg-beaver-main')?.getBoundingClientRect();
    if (feet && feet.height) GROUND = Math.round(feet.bottom / innerHeight * H);
    st.textContent = '.scene-heading span,.welcome-card,.turn-back,#bg-beaver-main,#bg-beaver-2,#bg-raccoon{display:none!important}';
    doc.head.append(st);
    const head = doc.querySelector('.scene-heading'), sub = doc.createElement('p');
    sub.textContent = 'where wolts live';
    sub.style.cssText = "margin:10px 0 0;color:#ffca4e;font:600 22px 'JetBrains Mono',monospace;letter-spacing:.08em;text-shadow:2px 2px #18100a";
    head?.append(sub);
  }, 300);
});
const names = [...CREW.flatMap(([k, h]) => ['c-' + k, 'h-' + h]), 'n-mushroom', 'n-fern', 'n-flower'];
Promise.all(names.map(load)).then(() => requestAnimationFrame(tick));
</script>
