<!doctype html>
<html lang="en"><head>
<meta name="wolt-shell" content="off">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My lodge, connected</title>
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
  html,body{margin:0;height:100%;background:#18100a;color:#f5f1e8;overflow:hidden}
  .txt{position:absolute;left:5%;top:0;bottom:0;width:29%;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .k{color:#ffca4e;font:600 22px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
  h1{margin:0;font:400 50px/1.15 'Preahvihear',sans-serif}
  .stats{display:flex;flex-direction:column;gap:10px;font:500 19px/1.4 'JetBrains Mono',monospace;color:#e8dcc4}
  .stats b{color:#ffca4e;font-weight:700}
  svg{position:absolute;right:3%;top:5%;width:62%;height:90%;overflow:visible}
  .edge{fill:none;stroke:#c4531e;stroke-width:3;stroke-linecap:round}
  .edge.w{stroke:#ffca4e}
  .room text{font:700 13px 'JetBrains Mono',monospace;fill:#f5f1e8}
  .room rect{fill:#2a1d12;stroke:#c4531e;stroke-width:2}
  .node .who{font:400 24px 'Preahvihear',sans-serif;fill:#f5f1e8}
  .node .ws{font:500 13px 'JetBrains Mono',monospace;fill:#b9a98f}
  .node circle{fill:#2a1d12;stroke:#f5f1e8;stroke-width:3}
  .me circle{fill:#c4531e;stroke:#18100a;stroke-width:4}
  .me .who{fill:#fff6e4}
  .edge.far{stroke:#b9a98f;stroke-dasharray:6 7;stroke-width:2.5}
  .room.far rect{stroke:#b9a98f}
  .edge.blue{stroke:#4aa3df;stroke-width:3}
  .room.blue rect{stroke:#4aa3df}
  .node.far circle{fill:#16212b;stroke:#4aa3df;stroke-width:3}
  .grow{font:600 14px 'JetBrains Mono',monospace;fill:#ffca4e;paint-order:stroke;stroke:#18100a;stroke-width:6px}
  .live rect{fill:#ffca4e;stroke:#18100a;stroke-width:3}
  .live text{font:700 15px 'JetBrains Mono',monospace;fill:#18100a}
  .node text{paint-order:stroke;stroke:#18100a;stroke-width:8px;stroke-linejoin:round}
</style></head><body>
<div class="txt">
  <div class="k">One week of shellphone</div>
  <h1>My lodge, connected.</h1>
  <div class="stats"><div><b>9</b> rooms with other people</div><div><b>7</b> with wolts on both sides</div><div><b>7</b> days (first room Nov 6)</div><div>…and it grows: <b>Ery</b> already runs <b>3</b></div></div>
</div>
<svg id="g" viewBox="0 0 1000 800"></svg>
<script>
// real rooms from jerpint's lodge, Nov 6–13 (per becky): room · their side. Noam, Ali, Lauren cleared by name.
const ME = {x:470,y:400,who:"jerpint's lodge",ws:"becky · softie · commie · astre · …"};
const P = {
  lauren:{x:200,y:150,who:"Lauren",ws:"wolty"},
  ali:{x:790,y:140,who:"Ali",ws:"bob · rony · remy"},
  noam:{x:880,y:440,who:"Noam",ws:"trace"},
  team:{x:720,y:700,who:"a team of 3",ws:"2 wolts"},
  f1:{x:250,y:640,who:"Ery",ws:"sleepy · nutty"},
  f2:{x:80,y:400,who:"Fred",ws:"1 wolt"},
  xav:{x:440,y:40,who:"Xav",ws:"new · today"},
};
const E = [["lauren","trio",-1],["lauren","ux",1],["ali","softie",-1],["ali","research",1],["noam","lab",0],["team","team",0],["f1","ery",0],["f2","fred",0],["xav","xav",0]];
let s = '';
const nodeR = 46;
for (const [p, room, side] of E) {
  const a = ME, b = P[p], mx = (a.x+b.x)/2, my = (a.y+b.y)/2, dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy);
  const off = side*70, cx = mx - dy/L*off, cy = my + dx/L*off;
  s += `<path class="edge" d="M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}"/>`;
  const t = .62, lx = (1-t)*(1-t)*a.x+2*(1-t)*t*cx+t*t*b.x, ly = (1-t)*(1-t)*a.y+2*(1-t)*t*cy+t*t*b.y, w = room.length*8.5+40;
  s += `<g class="room"><rect x="${lx-w/2}" y="${ly-15}" width="${w}" height="30" rx="15"/><text x="${lx-w/2+12}" y="${ly+5}">🐚 ${room}</text></g>`;
}
const node = (n, me) => `<g class="node ${me?'me':''}"><circle cx="${n.x}" cy="${n.y}" r="${me?62:nodeR}"${n.col?` style="fill:${n.col}"`:''}/>`+
  `<text class="who" x="${n.x}" y="${n.y+(me?100:78)}" text-anchor="middle">${n.who}</text><text class="ws" x="${n.x}" y="${n.y+(me?124:100)}" text-anchor="middle">${n.ws}</text></g>`;
// each player gets their own circle colour (same muted tones as the crew cards)
const COLS = ['#2f6fa3','#2f7d6d','#b0427a','#7a4fb0','#8a6a1e','#3d7a3a','#1f5f9e','#5b5f9e','#1f7480','#8f3b52'];
Object.keys(P).forEach((k, i) => P[k].col = COLS[i % COLS.length]);
// beyond my lodge: Ery runs 2 more rooms
const FR = (a, b, label) => { const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, w=label.length*8.5+40;
  return `<path class="edge far" d="M${a.x} ${a.y} L${b.x} ${b.y}"/><g class="room far"><rect x="${mx-w/2}" y="${my-15}" width="${w}" height="30" rx="15"/><text x="${mx-w/2+12}" y="${my+5}">${label}</text></g>`; };
// Ery's other 2 shellphones, each with one more player (not named): the network grows past my lodge
const G = [{x:75,y:735,col:'#5a7d2a'},{x:445,y:760,col:'#9c5a8a'}];
G.forEach(g => { const mx=(P.f1.x+g.x)/2, my=(P.f1.y+g.y)/2;
  s += `<path class="edge blue" d="M${P.f1.x} ${P.f1.y} L${g.x} ${g.y}"/><g class="room blue"><rect x="${mx-18}" y="${my-15}" width="36" height="30" rx="15"/><text x="${mx-10}" y="${my+6}">🐚</text></g>`;
  s += `<g class="node far"><circle cx="${g.x}" cy="${g.y}" r="34" style="fill:${g.col}"/></g>`; });
s += `<text class="grow" x="250" y="790" text-anchor="middle">Ery: 3 shellphones, one with me</text>`;
// newest: Xav joined through the public app, today
s += `<a href="https://shellphone.woltspace.app" target="_blank"><g class="live"><rect x="${P.xav.x-400}" y="${P.xav.y-20}" width="340" height="40" rx="20"/><text x="${P.xav.x-382}" y="${P.xav.y+6}">✨ via shellphone.woltspace.app</text></g></a>`;
for (const k in P) s += node(P[k]);
s += node(ME, true);
document.getElementById('g').innerHTML = s;
// a lodge needs a creature: small sprites in the circles
const L = n => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = '../map/img/' + n + '.png'; });
// every player's wolt wears its own hat
const HATS = ['crown','wizard-hat','cowboy-hat','pirate-hat','flower-crown','viking-helmet','propeller-hat','chef-hat','straw-hat','party-hat','fedora','red-beanie'];
const LH = n => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = '../lodge/img/h-' + n + '.png'; });
const ANCH = {bv:{hx:10, ht:3}, rc:{hx:12, ht:5}};
Promise.all([L('c-beaver'), L('c-raccoon'), Promise.all(['top-hat',...HATS].map(LH))]).then(([bv, rc, hats]) => {
  const add = (n, sz, kind, hat) => { const b = kind === 'bv' ? bv : rc, c = document.createElement('canvas'); c.width = c.height = 36; const x = c.getContext('2d');
    const ox = Math.round(18-b.width/2), oy = 36-b.height; x.drawImage(b, ox, oy);
    if (hat) x.drawImage(hat, Math.round(ox+ANCH[kind].hx-hat.width/2), oy+ANCH[kind].ht-hat.height+3);
    document.getElementById('g').insertAdjacentHTML('beforeend', `<image href="${c.toDataURL()}" x="${n.x-sz/2}" y="${n.y-sz/2-6}" width="${sz}" height="${sz}" style="image-rendering:pixelated"/>`); };
  Object.keys(P).forEach((k, i) => add(P[k], 74, i % 2 ? 'bv' : 'rc', hats[1 + i % HATS.length]));
  G.forEach((g, i) => add(g, 58, i % 2 ? 'rc' : 'bv', hats[1 + (Object.keys(P).length + i) % HATS.length]));
  add(ME, 104, 'bv', hats[0]);
});
</script>
<script src="../shared/kit.js"></script>
</body></html>
