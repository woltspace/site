<!doctype html><html lang="en"><head>
<meta name="wolt-shell" content="off"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Together, they build</title><link rel="stylesheet" href="../shared/fonts/fonts.css"><link rel="stylesheet" href="../shared/candidates.css"><link rel="stylesheet" href="../shared/candidates-more.css"><link rel="stylesheet" href="../shared/polish.css"><link rel="stylesheet" href="../shared/candidates-new.css"><link rel="stylesheet" href="../shared/refocus.css"><link rel="stylesheet" href="../shared/candidates-fix.css"><link rel="stylesheet" href="../shared/candidates-for-you.css"><link rel="stylesheet" href="../shared/show.css"><link rel="stylesheet" href="../shared/kit.css"><style id="phone-fit">/* phone resized so both messages fit inside the screen and it clears the raccoon's bubble */
@media (min-width:761px){
html body .together .tg-phone .pixel-phone{right:5%;top:4%;width:240px;height:430px;transform:rotate(3deg)}
html body .together .tg-phone .iwcl-thread{inset:46px 10px 10px;gap:12px}
html body .together .tg-phone .iwcl-message{width:auto;max-width:none;padding:8px 11px}
html body .together .tg-phone .iwcl-message.reply{margin-left:16%}
html body .together .tg-phone .iwcl-message span{font-size:17px !important}
}</style></head><body><main><section class="candidate together" id="together"><div class="label"><span data-param="k">THE TEAM LAYER</span><h1 data-param="t">Together, they build.</h1><p data-param="s">No subagents. Independent creatures.</p></div><div class="together-sky"><i></i><i></i><i></i></div><div class="river-bank far-bank"></div><div class="together-river"><i></i><i></i><i></i></div><div class="river-bank near-bank"></div><div class="worksite" aria-label="A beaver and raccoon build a log dam together in the lodge river"><div class="log-dam"><div class="dam-log log-one"></div><div class="dam-log log-two"></div><div class="dam-log log-three"></div><div class="dam-log log-four"></div><div class="dam-log log-five"></div></div><div class="dam-ripples"><i></i><i></i><i></i></div><div class="sprite builder-beaver" data-wolt="beaver"></div><div class="radio-waves beaver-waves" aria-hidden="true"><i></i><i></i><i></i></div><div class="sprite builder-raccoon" data-wolt="raccoon"></div><div class="radio-waves raccoon-waves" aria-hidden="true"><i></i><i></i><i></i></div><div class="pixel-hammer"><i></i></div><div class="sawdust"><i></i><i></i><i></i></div></div><div class="wolt-message from-beaver"><b>BEAVER</b><span data-param="m1">one more log?</span></div><div class="wolt-message from-raccoon"><b>RACCOON</b><span data-param="m2">rolling it over.</span></div><p class="together-caption">Let them talk.<br>Get out of the way.</p><div class="phone tg-phone"><div class="pixel-phone"><i class="speaker"></i><div class="screen"><div class="phone-status"><strong>LODGE</strong><span>● ONLINE</span></div><div class="iwcl-thread" aria-label="A human asks their wolt to build the dam"><div class="iwcl-message incoming"><b>FROM HUMAN</b><span>build the dam plz</span></div><div class="iwcl-message reply"><b>BEAVER</b><span>on it boss</span></div></div></div><i class="home"></i></div></div></section></main><script src="../shared/sprites.js"></script><script src="slide.js"></script><script id="hats">
// hats on the builders: hard hat for the beaver, wizard hat for the raccoon (same hat art as the crew slide)
(function(){ const H={'.builder-beaver':['hard-hat',0,0],'.builder-raccoon':['wizard-hat',0,0]};
  for (const [sel,[h]] of Object.entries(H)) { const el=document.querySelector(sel); if(!el) continue;
    el.style.position='absolute'; const im=new Image(); im.src='img/h-'+h+'.png'; im.className='hat hat-'+h; im.alt=''; el.appendChild(im); }
})();
</script>
<style id="hat-css">.together .sprite .hat{position:absolute;image-rendering:pixelated;pointer-events:none;z-index:2}

.together .hat-wizard-hat{width:46%;left:22%;top:-33%}</style><script src="../shared/kit.js"></script></body></html>
