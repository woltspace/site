<!doctype html>
<html lang="en"><head>
<meta name="wolt-shell" content="off">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The team, as it really is</title>
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#18100a}
  #board{position:absolute;inset:3%;border-radius:10px;box-shadow:inset 0 0 0 10px #5a3a1e,inset 0 0 40px #0008,12px 12px #000a;
    background:#b9875a radial-gradient(#0000 0 1px,#0000 1px) ;background-image:radial-gradient(#8d6038 1px,transparent 1.5px),radial-gradient(#c79a6c 1px,transparent 1.5px);background-size:9px 9px,13px 13px;background-position:0 0,4px 6px;overflow:hidden}
  svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .note{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));background:#fff3a8;padding:14px 18px 12px;font:700 26px 'JetBrains Mono',monospace;color:#2a1d12;box-shadow:4px 6px 10px #0005;white-space:nowrap}
  .note small{display:block;font:500 15px 'JetBrains Mono',monospace;color:#6b5636;margin-top:3px}
  .pol{position:absolute;transform:translate(-50%,-50%) rotate(var(--r));background:#fbf7ef;padding:8px 8px 10px;box-shadow:4px 6px 10px #0006;text-align:center}
  .pol .ph{width:96px;height:96px;background:var(--bg);display:grid;place-items:center}
  .pol canvas{width:84px;height:84px;image-rendering:pixelated}
  .pol b{display:block;font:700 18px 'JetBrains Mono',monospace;color:#2a1d12;margin-top:5px}
  .pol i{display:block;font:600 13px 'JetBrains Mono',monospace;font-style:normal;color:var(--h)}
  .pin{position:absolute;left:50%;top:-7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#c0261a 60%,#7a120a);box-shadow:1px 2px 3px #0007}
  .scrawl{position:absolute;transform:rotate(var(--r));font:400 30px 'Preahvihear',sans-serif;color:#7a120a}
  .title{position:absolute;left:4%;bottom:4%;transform:rotate(-2deg);background:#fbf7ef;padding:20px 36px 16px;font:400 60px/1.1 'Preahvihear',sans-serif;color:#2a1d12;box-shadow:5px 8px 12px #0007;z-index:6}
  .title::before{content:'';position:absolute;left:50%;top:-9px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff7a6b,#c62d22 60%,#7d140e);box-shadow:2px 3px 3px #0006}
</style></head><body>
<div id="board"><svg id="yarn"></svg></div>
<script>
const H={claude:'#c4531e',codex:'#2e7d3a',open:'#2f5f9a'};
const W={
 becky:{k:'beaver',hat:'hard-hat',h:'claude',m:'Claude · Opus',bg:'#2f6fa3',x:47,y:16,r:-4},
 softie:{k:'raccoon',hat:'wizard-hat',face:'aviators',h:'claude',m:'Claude · Fable',bg:'#2f7d6d',x:62,y:46,r:5},
 commie:{k:'beaver',hat:'beret',h:'claude',m:'Claude · Opus',bg:'#b0427a',x:80,y:22,r:-6},
 astre:{k:'raccoon',hat:'graduation-cap',face:'nerd',h:'codex',m:'Codex · GPT-6',bg:'#7a4fb0',x:33,y:52,r:3},
 paperpal:{k:'beaver',h:'codex',m:'Codex · GPT-6',bg:'#6b8f4e',x:13,y:24,r:-3},
 uxwolt:{k:'raccoon',h:'claude',m:'Claude · Opus',bg:'#c08a3a',x:14,y:44,r:4},
 kimi:{k:'raccoon',h:'open',m:'open · Kimi K3',bg:'#3d6f9a',x:86,y:66,r:-5},
 openwolt:{k:'raccoon',h:'open',m:'open · GLM 5.2',bg:'#5a7fa8',x:84,y:84,r:6}};
const P={
 papers:{t:'Papers',s:'research',x:28,y:30,r:-6},
 woltspace:{t:'woltspace',s:'the platform',x:30,y:72,r:4},
 shellphone:{t:'shellphone',s:'the app',x:58,y:28,r:-3},
 talks:{t:'Talks',s:'this deck!',x:88,y:42,r:7},
 experiments:{t:'open models',s:'experiments',x:66,y:68,r:-4},
 reviews:{t:'code review',s:'',x:16,y:68,r:8}};
const E=[['paperpal','papers'],['astre','papers'],['astre','reviews'],['astre','shellphone'],['astre','woltspace'],
 ['softie','woltspace'],['softie','shellphone'],['uxwolt','woltspace'],['becky','shellphone'],['commie','shellphone'],
 ['commie','talks'],['kimi','experiments'],['openwolt','experiments']];
const ANCH={raccoon:{hx:9.5,ht:2,gl:{L:[4,6],R:[11,13],y:[7,8]}},beaver:{hx:8.5,ht:1,gl:{L:[3,5],R:[8,11],y:[4,6]}}};
const G={aviators:{frame:'#c9a23a',lens:'#2d4a5c',glint:'#bfe6ff'},nerd:{frame:'#111',lens:null,glint:null}};
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='img/'+s+'.png';});
function glasses(c,A,g,ox,oy){const px=(x,y,col)=>{c.fillStyle=col;c.fillRect(ox+x,oy+y,1,1)};const[y0,y1]=A.gl.y;
 for(const[x0,x1]of[A.gl.L,A.gl.R]){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const e=g.lens===null&&(y===y0||y===y1||x===x0||x===x1);if(g.lens)px(x,y,y===y0?g.frame:g.lens);else if(e)px(x,y,g.frame);}if(g.glint)px(x0+1,y1,g.glint);}
 for(let x=A.gl.L[1]+1;x<A.gl.R[0];x++)px(x,y0,g.frame);px(A.gl.L[0]-1,y0,g.frame);px(A.gl.R[1]+1,y0,g.frame);}
(async()=>{const imgs={};await Promise.all([...new Set(Object.values(W).flatMap(w=>['c-'+w.k].concat(w.hat?['h-'+w.hat]:[])))].map(async n=>imgs[n]=await load(n)));
 const b=document.getElementById('board'),svg=document.getElementById('yarn');
 const BW=b.clientWidth,BH=b.clientHeight,pt=o=>[o.x/100*BW,o.y/100*BH];
 // red string first (behind everything), slightly sagging
 let paths='';for(const[w,p]of E){const[a,c]=[pt(W[w]),pt(P[p])];const mx=(a[0]+c[0])/2,my=(a[1]+c[1])/2+30;
  paths+=`<path d="M${a[0]} ${a[1]} Q${mx} ${my} ${c[0]} ${c[1]}" stroke="#b3201a" stroke-width="3" fill="none" opacity=".9"/>`;}
 svg.setAttribute('viewBox',`0 0 ${BW} ${BH}`);svg.innerHTML=paths;
 for(const[k,p]of Object.entries(P)){const n=document.createElement('div');n.className='note';n.style.left=p.x+'%';n.style.top=p.y+'%';n.style.setProperty('--r',p.r+'deg');
  n.innerHTML=`<span class=pin></span>${p.t}${p.s?`<small>${p.s}</small>`:''}`;b.append(n);}
 for(const[id,w]of Object.entries(W)){const A=ANCH[w.k],body=imgs['c-'+w.k];const cv=document.createElement('canvas');cv.width=cv.height=40;const c=cv.getContext('2d');
  const ox=Math.round(20-body.width/2),oy=38-body.height;c.drawImage(body,ox,oy);if(w.face)glasses(c,A,G[w.face],ox,oy);
  if(w.hat){const hat=imgs['h-'+w.hat];c.drawImage(hat,Math.round(ox+A.hx-hat.width/2),oy+A.ht-hat.height+3);}
  const d=document.createElement('div');d.className='pol';d.style.left=w.x+'%';d.style.top=w.y+'%';d.style.setProperty('--r',w.r+'deg');d.style.setProperty('--bg',w.bg);d.style.setProperty('--h',H[w.h]);
  d.innerHTML='<span class=pin></span><div class=ph></div>';d.querySelector('.ph').append(cv);d.insertAdjacentHTML('beforeend',`<b>${id}</b><i>${w.m}</i>`);b.append(d);}
 const t=document.createElement('div');t.className='title';t.textContent='Teams are fluid.';b.append(t);
 [['?',39,33,-10]].forEach(([s,x,y,r])=>{const e=document.createElement('div');e.className='scrawl';e.style.left=x+'%';e.style.top=y+'%';e.style.setProperty('--r',r+'deg');e.textContent=s;b.append(e);});
})();
</script>
<script src="../shared/kit.js"></script>
</body></html>
